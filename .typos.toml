[default]
extend-ignore-re = [
    # ns alias
    ":as [0-9a-z]*\\]"
]

[default.extend-words]
Blance = "Blance"
edn = "edn"
juxt = "juxt"

[type.conf]
extend-glob = ["*.conf"]
check-file = false

[type.gpg]
extend-glob = ["*.gpg"]
check-file = false

[type.min-js]
extend-glob = ["*.min.js"]
check-file = false
